# Jev gölge modu için jev-live.service eki (drop-in).
# Konum: /etc/systemd/system/jev-live.service.d/jev-golge.conf
# - TypeSafe SDK'sı kurulu ayrı Python ortamını kullanır (/opt/jev/venv).
# - API anahtarını yalnızca root'un okuyabildiği dosyadan ortam değişkeni olarak verir.
# Kaldırmak: bu dosyayı silip `systemctl daemon-reload` (bot eski hâline döner).
[Service]
EnvironmentFile=-/etc/jev/typesafe.env
ExecStart=
ExecStart=/opt/jev/venv/bin/python -m jev.live run --dir /var/lib/jev/canli
