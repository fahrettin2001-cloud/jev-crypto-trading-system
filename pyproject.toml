[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev"
version = "0.1.0"
description = "Jev kripto işlem sistemi — yalnızca sanal işlem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=46,<51"]

[tool.setuptools.packages.find]
include = ["jev*"]
